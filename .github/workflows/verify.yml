name: Verify and deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      allow_contract_migrations:
        description: >-
          Apply pending contract (destructive) migrations. Only after the
          compatible frontend has been live for a service-worker window and a
          fresh backup exists.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.database.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect database changes
        id: database
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            changed=true
          elif [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            changed=true
          elif ! git cat-file -e "$BASE_SHA^{commit}"; then
            changed=true
          elif git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- supabase/ tests/integration/; then
            changed=false
          else
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use supported Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Validate every migration changed by this release
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: node scripts/check-migration-rollout.js --base "$MIGRATION_BASE_SHA"

      - name: Test and verify generated files
        run: npm run check

  supabase-integration:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use supported Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start migrated local Supabase
        run: supabase start

      - name: Verify database permissions and RPCs
        run: npm run test:integration

  # Read-only rehearsal of everything migrate-production does before it writes: the
  # credential, the link, the listing and the contract guard. It deliberately waits for
  # nothing, so a bad secret or an unreadable listing fails in under a minute instead of
  # after the four minutes of checks that gate the real job.
  production-preflight:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.database == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    environment: production-database
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use supported Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Refuse to run without a credential
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is empty on the production-database environment" >&2
            exit 1
          fi

      - name: Link the production project
        run: supabase link --project-ref igeeigohcupcxakmlxno

      - name: Read the production migration history
        run: |
          supabase migration list --linked --output-format json > migration-list.txt 2>&1
          echo "::group::supabase migration list --linked --output-format json"
          cat migration-list.txt
          echo "::endgroup::"

      - name: Rehearse the contract guard
        if: ${{ !inputs.allow_contract_migrations }}
        run: >-
          node scripts/check-migration-rollout.js --pending --reject-contract
          < migration-list.txt

  migrate-production:
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.database == 'true' &&
      needs.check.result == 'success' &&
      needs.supabase-integration.result == 'success' &&
      needs.production-preflight.result == 'success'
    needs: [changes, check, supabase-integration, production-preflight]
    runs-on: ubuntu-latest
    environment: production-database
    concurrency:
      group: production-database
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use supported Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link the production project
        run: supabase link --project-ref igeeigohcupcxakmlxno

      # Capture the listing to a file and print it before anything parses it. Both
      # streams are kept because the CLI splits progress lines and payload across them
      # without guaranteeing which gets what. A listing carries only migration versions
      # and timestamps, never credentials, so logging it in full is safe — and it is
      # what turns a parsing failure here into an answer rather than another CI round
      # trip.
      - name: Read the production migration history
        run: |
          supabase migration list --linked --output-format json > migration-list.txt 2>&1
          echo "::group::supabase migration list --linked --output-format json"
          cat migration-list.txt
          echo "::endgroup::"

      - name: Refuse to apply contract migrations without an explicit release
        if: ${{ !inputs.allow_contract_migrations }}
        run: >-
          node scripts/check-migration-rollout.js --pending --reject-contract
          < migration-list.txt

      - name: Preview pending migrations
        run: supabase db push --linked --dry-run

      - name: Apply pending migrations
        run: supabase db push --linked

      - name: Record migration history
        run: supabase migration list --linked --output-format json

  production-backend-contract:
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.check.result == 'success' &&
      (needs.supabase-integration.result == 'success' ||
      needs.supabase-integration.result == 'skipped') &&
      (needs.migrate-production.result == 'success' ||
      needs.migrate-production.result == 'skipped')
    needs: [check, supabase-integration, migrate-production]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use supported Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Refuse a frontend incompatible with the production backend
        run: npm run smoke:backend

  build-pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest
    outputs:
      planner: ${{ steps.page-builds.outputs.planner }}
      repertoire: ${{ steps.page-builds.outputs.repertoire }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use supported Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Build deployable files
        run: npm run build

      - name: Stage explicit Pages surface
        run: npm run stage:pages

      - name: Read the build each page reports to Sentry
        id: page-builds
        run: node scripts/page-builds.js >> "$GITHUB_OUTPUT"

      # Exactly the scripts and maps being deployed, for the Sentry release to resolve
      # stack frames against after Pages has moved on to a later deployment.
      - name: Keep the deployed scripts for Sentry
        uses: actions/upload-artifact@v7
        with:
          name: deployed-scripts
          path: |
            .pages-site/**/*.js
            .pages-site/**/*.js.map
          # The staged site lives in a dot-directory, which uploads skip by default.
          include-hidden-files: true
          retention-days: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-site

  deploy-pages:
    needs: [build-pages, production-backend-contract]
    if: >-
      always() &&
      needs.build-pages.result == 'success' &&
      needs.production-backend-contract.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Each page reports its release as `<surface>@<build>`. Registering those releases once
  # they are live ties every Sentry event to the commit it was built from and marks the
  # deploy. It runs after deployment, so a Sentry outage cannot hold back the site.
  sentry-release:
    needs: [build-pages, deploy-pages]
    if: always() && needs.deploy-pages.result == 'success'
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: datamediate-jc
      SENTRY_PROJECT: sundaymass
    steps:
      - name: Check out repository with history for commit association
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch the deployed scripts
        uses: actions/download-artifact@v8
        with:
          name: deployed-scripts
          path: deployed-scripts

      # Sentry's automatic range starts at the newest release, which for the second page
      # is the first page's release from a moment ago, so name the pushed range instead.
      - name: Find the commit range this deployment covers
        id: range
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD~1)"
          fi
          echo "previous=$BEFORE" >> "$GITHUB_OUTPUT"

      - name: Register the planner release
        uses: getsentry/action-release@v3
        with:
          release: planner@${{ needs.build-pages.outputs.planner }}
          environment: production
          sourcemaps: deployed-scripts
          url_prefix: "~/sundaymass"
          inject: false
          set_commits: manual
          repo: ${{ github.repository }}
          commit: ${{ github.sha }}
          previous_commit: ${{ steps.range.outputs.previous }}

      - name: Register the repertoire release
        uses: getsentry/action-release@v3
        with:
          release: repertoire@${{ needs.build-pages.outputs.repertoire }}
          environment: production
          sourcemaps: deployed-scripts
          url_prefix: "~/sundaymass"
          inject: false
          set_commits: manual
          repo: ${{ github.repository }}
          commit: ${{ github.sha }}
          previous_commit: ${{ steps.range.outputs.previous }}

  production-smoke:
    needs: deploy-pages
    if: always() && needs.deploy-pages.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use supported Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Exercise production in a fresh browser
        env:
          SITE_URL: https://tow.github.io/sundaymass/
        run: npm run smoke:production
