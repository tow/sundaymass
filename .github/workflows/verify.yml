name: Verify and deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      allow_contract_migrations:
        description: Apply explicitly marked contract migrations after the compatibility window
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use supported Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Validate every migration changed by this release
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: node scripts/check-migration-rollout.js --base "$MIGRATION_BASE_SHA"

      - name: Test and verify generated files
        run: npm run check

  supabase-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use supported Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start migrated local Supabase
        run: supabase start

      - name: Verify database permissions and RPCs
        run: npm run test:integration

  release-backend:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [check, supabase-integration]
    environment:
      name: production
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: igeeigohcupcxakmlxno
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require production deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN to the production GitHub environment."
            exit 1
          fi

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Refuse automatic contract migrations
        env:
          ALLOW_CONTRACT_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_contract_migrations }}
          MIGRATION_BASE_SHA: ${{ github.event.before || 'HEAD^' }}
        run: |
          if [ "$ALLOW_CONTRACT_MIGRATIONS" = "true" ]; then
            node scripts/check-migration-rollout.js --base "$MIGRATION_BASE_SHA"
          else
            node scripts/check-migration-rollout.js --base "$MIGRATION_BASE_SHA" --reject-contract
          fi

      - name: Link the production Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview pending production migrations
        run: supabase db push --linked --dry-run

      - name: Apply compatible production migrations
        run: supabase db push --linked

      - name: Deploy the compatible Edge Function
        run: supabase functions deploy semantic-songs --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify the public production backend contract
        run: node scripts/production-backend-smoke.js

  build-pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: release-backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use supported Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Build deployable files
        run: npm run build

      - name: Stage explicit Pages surface
        run: npm run stage:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-site

  deploy-pages:
    needs: build-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  production-smoke:
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use supported Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Exercise production in a fresh browser
        env:
          SITE_URL: https://tow.github.io/sundaymass/
        run: npm run smoke:production
